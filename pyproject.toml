[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxysmith"
version = "0.1.0"
description = "Reverse proxy configuration generator for homelabbers and self-hosters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ProxySmith Contributors" }]
keywords = ["nginx", "caddy", "traefik", "reverse-proxy", "homelab", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.scripts]
proxysmith = "proxysmith.cli.main:app"

[project.urls]
Homepage = "https://github.com/dexxzy/proxysmith"
Repository = "https://github.com/dexxzy/proxysmith"
Issues = "https://github.com/dexxzy/proxysmith/issues"

[tool.hatch.build.targets.wheel]
packages = ["proxysmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
